# AI provider configuration (plan §4.2).
#
# Config is per-capability, not per-app - each capability below can point
# at a different provider/model independently. All 6 capabilities are now
# used: ocr, product_isolation, vision_analysis (M4), text_generation
# (M5), prompt_generation (M6), image_generation (Phase 8.2 of the
# Generation -> Validation proof of loop, see MIGRATION_PLAN.md).
#
# API keys are NOT stored here - see app/ai_providers/config.py
# (get_api_key) for how credentials are resolved (macOS Keychain, with an
# environment variable fallback for local development).

# ---------------------------------------------------------------------------
# ROLE-BASED ROUTING (provider-routing audit).
#
# The capability map below says which adapter serves each technical
# capability. This section says WHY - the role each provider plays - so the
# intended architecture is stated in one place rather than inferred from
# which call sites happen to pass an override.
#
# Roles are resolved by app/ai_providers/routing.py, which fails loudly on an
# unknown provider or role rather than silently substituting a default.
routing:
  # Multimodal analysis and visual understanding. Cheaper, and adequate.
  visual_analysis_provider: gemini
  # Strict structured output, adjudication, reconciliation, compilation.
  structured_reasoning_provider: openai
  # Image generation.
  primary_image_provider: nano_banana
  high_quality_image_provider: nano_banana
  fallback_image_provider: openai
  # Post-generation visual checks.
  visual_validation_provider: gemini
  # Final policy adjudication, alongside local deterministic rules.
  policy_validation_provider: openai

providers:
  # Real-world-driven cost/quality change (see MIGRATION_PLAN.md): OCR,
  # Product Lock Profile, and Creative Fingerprint moved to Gemini -
  # dramatically cheaper than GPT-5.5 for these multimodal analysis
  # tasks, per the user's own direct request. OCR moves wholesale
  # (default flipped to gemini here - one call site, one schema).
  # vision_analysis deliberately stays "openai" as the DEFAULT - Product
  # Lock Profile Stage and Creative Fingerprint Stage explicitly request
  # provider_name="gemini" per-call (registry.py's vision() override);
  # every other vision_analysis task (Scene Intelligence, Identity/Image
  # Validation, Photorealism, Reference Scoring) is unaffected and keeps
  # using this default. A narrower scope the user chose explicitly, to
  # avoid re-calibrating the whole quality bar those tasks judge against
  # at the same time as the pipeline stages feeding it change.
  ocr: gemini
  # Reliability follow-up (see MIGRATION_PLAN.md) - a real, live Gemini
  # outage hit OCR (gemini-flash-latest) with 503s alongside image
  # generation and vision_analysis's gemini override. ocr_stage.py
  # retries once against this provider whenever the primary OCR call
  # itself raises. null disables fallback entirely.
  ocr_fallback: openai
  product_isolation: openai
  vision_analysis: openai
  text_generation: openai
  prompt_generation: openai
  # Phase 10.1 of the AI Creative Engine vNext (see MIGRATION_PLAN.md's
  # ADR §10) - Nano Banana is the default image_generation provider, an
  # implementation choice, not an architectural one: the
  # ImageGenerationProvider abstraction (app/ai_providers/base.py) and
  # the registry's multi-provider support (registry.py's
  # image_generation(provider_name=...) override) are what make this a
  # one-line config choice rather than a code change - OpenAI's adapter
  # is unchanged and still fully registered/selectable, just not the
  # default anymore.
  image_generation: nano_banana
  # Reliability follow-up to the Story Slide feature (see
  # MIGRATION_PLAN.md) - a real live 503 ("high demand") from Nano
  # Banana surfaced as a clean per-slide failure rather than a hang or
  # crash (Tier 1.3's exception handling working as intended), but the
  # user's explicit call: a transient outage on the primary provider
  # should never be a user-visible failure when a second, fully-
  # registered provider already exists. generation_engine.py's
  # _generate_candidates retries once against this provider whenever
  # the primary image_generation call itself raises. null disables
  # fallback entirely.
  image_generation_fallback: openai

models:
  openai:
    ocr: gpt-5.5
    product_isolation: gpt-5.5
    vision_analysis: gpt-5.5
    text_generation: gpt-5.5
    prompt_generation: gpt-5.5
    # CORRECTED 2026-07-25 (Phase 1 remediation, WP-1): the previous
    # comment here claimed "gpt-5.5 is not a real OpenAI model", based on
    # a 400 from the IMAGES api. That inference was wrong - gpt-5.5 is a
    # real chat model and simply is not an image model. A real
    # chat.completions call confirmed it serves and bills as
    # "gpt-5.5-2026-04-23". Only image_generation needed a different
    # model, which is what this line is.
    image_generation: gpt-image-1
  nano_banana:
    # gemini-3.1-flash-image-preview - "Nano Banana 2," the general-
    # purpose tier (per app/ai_providers/nano_banana_adapter.py's own
    # docstring). Switched from gemini-3.1-flash-lite-image ("Nano
    # Banana Lite"/"Nano Banana 2 Lite") after the user, who also uses
    # Nano Banana directly outside this app, diagnosed the Lite tier
    # itself as the real cause of near-universal branding_text
    # validation failures - Lite is "engineered for velocity and
    # scale," not per-request text-fidelity quality, unlike the
    # general-purpose tier. Must be live-verified with a real API call
    # before being trusted, same discipline as every other provider
    # change in this codebase.
    image_generation: gemini-3.1-flash-image-preview
  gemini:
    # Distinct entry from nano_banana above even though both are Google
    # Gemini models under the same account - these are the general-
    # purpose multimodal analysis family, not the gemini-3.1-*-image
    # image-generation family nano_banana configures. Flash for OCR
    # (simple extraction); Pro for vision_analysis (Product Lock Profile
    # + Creative Fingerprint - the detailed structured descriptions
    # generation quality depends on), per the user's own "simple
    # extraction -> Flash, deep analysis -> Pro" instruction.
    #
    # gemini-flash-latest/gemini-pro-latest, NOT gemini-2.5-flash/-pro -
    # a real, live-discovered correction: gemini-2.5-flash and
    # gemini-2.5-pro both returned a real 404 ("This model ... is no
    # longer available to new users") on this account during live
    # verification (2026-07-24) - a new-account restriction on this
    # specific dated snapshot, not a transient outage. The next dated
    # snapshot tried (gemini-3-pro-preview) was ALSO already retired
    # (404 "no longer available"). Google's own auto-updating -latest
    # aliases (confirmed live via a real generateContent call) always
    # point at the current recommended model per tier, avoiding this
    # exact deprecation problem recurring - a deliberate substitution
    # for the user's literal "2.5" naming, not a guess.
    ocr: gemini-flash-latest
    vision_analysis: gemini-pro-latest

# Optimisation & Stability Pass, Tier 3.2 (see MIGRATION_PLAN.md) - a
# documented value the next person can read/adjust, not a silent magic
# number buried in generation_engine.py. image_generation candidates
# within one attempt now run concurrently (app.slideshow_stages.
# concurrency.run_concurrently) rather than one-at-a-time; unlike every
# other stage's provider call (analysis-only, generally more permissive
# rate limits), no verified per-account RPM/concurrent-request ceiling
# was available for the image-generation models in use here (OpenAI
# gpt-image-1, Google gemini-3.1-flash-image-preview) - so this starts
# deliberately conservative (2, not the generic MAX_CONCURRENT_CALLS=4
# every other stage uses) and should be raised only after a real
# "maximum" mode batch is live-tested with no 429s/rate-limit errors in
# the captured provider-call data (app.services.timing_report).
concurrency_limits:
  image_generation: 2

# Daily spend limit (Phase 1 remediation, WP-5).
#
# SOFT cap, and deliberately so: it is checked once before a unit of
# paid work begins, and work already in flight always finishes. Total
# spend can therefore exceed this by at most the cost of one unit (one
# slideshow analysis, or one generation call). Aborting mid-batch would
# leave you paying for provider calls that produced nothing usable.
#
# Guards new paid work only - analysis, explicit paid reruns, reference
# scoring and image generation. Read-only endpoints are never blocked.
# Resets on the LOCAL calendar day.
#
# null (or omitting this block entirely) = no cap. That is the default,
# so shipping this feature cannot start blocking work on its own.
#
# NOTE: only calls with a TRUSTED cost count toward the total. Several
# models are honestly priced `unknown` in pricing.yaml today, and their
# spend cannot be counted - so the figure this cap compares against is a
# floor, not a certainty. Worth revisiting once those rates are resolved.
spend_limits:
  # Stays null (disabled) until the primary image provider has a
  # confirmed rate - see the unknown-cost policy below for why enabling
  # it right now would refuse most work rather than silently under-count.
  daily_usd: null

  # UNKNOWN-COST POLICY (follow-up to Checkpoint B, item 1).
  #
  # Unknown cost must never behave like zero. With the cap ENABLED, a
  # paid operation whose provider/model has no configured rate FAILS
  # CLOSED (429 unpriced_work_refused) rather than slipping past the cap
  # uncounted - otherwise the cap would not protect image generation,
  # the most expensive part of the workflow, which is exactly the part
  # currently unpriced.
  #
  # A conservative per-provider/per-capability ceiling is the escape
  # hatch: set one and that work is allowed, but RESERVES this amount
  # against today's budget so it still consumes it.
  #
  # These are YOUR conservative upper bounds - nothing here is inferred
  # from unofficial sources, and leaving them unset is the safe default.
  # Example (commented out; uncomment and set a real figure to use):
  #
  # unknown_cost_ceilings_usd:
  #   nano_banana:
  #     image_generation: 0.10
