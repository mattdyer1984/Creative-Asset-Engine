case_id: case08_fan_shelf
source_project_type: ugc_photographic
primary_text_mode: platform_caption

text_blocks:
  - text: "when ur paying £30 for this..."
    class: platform_caption
    expected_handling_mechanism: deterministic_overlay
    optional: true
  - text: "16\" Pedestal Fan"
    class: product_native
    expected_handling_mechanism: product_lock
    optional: false
  - text: "3 speed settings / Adjustable height / Oscillating function"
    class: product_native
    expected_handling_mechanism: product_lock
    optional: false
  - text: "£30"
    class: environmental
    expected_handling_mechanism: model_generated
    optional: false

overlay_policy: keep
copy_policy: preserve_verbatim
creative_intent: discovery

composition_contract:
  device: shelf-snapshot
  zones:
    - id: product
      role: product
      bounds: [0.18, 0.12, 0.82, 0.70]
    - id: caption
      role: text
      bounds: [0.12, 0.50, 0.88, 0.64]
    - id: price-label
      role: price
      bounds: [0.20, 0.72, 0.60, 0.82]
  relations:
    - [caption, above, price-label]
    - [price-label, below, product]
    - [price-label, attached-to, product]
  emphasis: [caption, product, price-label]

typography_system: null

production_value_strategy: refine

required_invariants:
  - the specific fan packaging with its illustration and feature icons
  - the shelf price label showing the same price named in the caption
  - a retail aisle context around the shelf
  - the product photographed in situ rather than isolated
  - wording verbatim

allowed_transformations:
  - camera position and distance
  - surrounding stock on adjacent shelves
  - floor surface, aisle furniture, store lighting
  - which other products are visible

forbidden_transformations:
  - removing the price label
  - changing the price so it disagrees with the caption
  - substituting different packaging
  - isolating the product on a studio background
  - reworded copy

human_rationale: >
  The creative is a discovery: someone finding an overpriced product on a real
  shelf. The price label is the evidence for the caption's complaint, so it and
  the packaging are locked while the store around them is free. The recreation
  pulled the camera back and filled the surrounding shelves with kettles - the
  retail context is required, the specific shop is not.

known_ambiguity: null

# Product annotation (suite v2). Governed human-assisted review:
# reviewer=Matt Dyer (via Claude, reviewed against evidence overlays)
# date=2026-07-26  provenance=0 region(s) from measured candidates, 1 drawn by the reviewer against the overlay
# evidence=docs/benchmark_review/annotations/case08_fan_shelf_annotation.png
product:
  name: "boxed 16in pedestal fan"
  appearance_bounds: [0.226, 0.115, 0.843, 0.798]
  instance_count: 1
  regions:
    - id: front-package
      bounds: [0.226, 0.115, 0.843, 0.798]
      method: reviewer_drawn
  expected_lock_fields:
    - product_category
    - product_type
    - packaging
    - colors
  immutable_characteristics:
    - "boxed pedestal fan, front-facing retail packaging"
    - "cream upper panel with a green lower panel and a fan illustration"
  reference_crops:
    - id: primary
      bounds: [0.226, 0.115, 0.843, 0.798]
  generation_expectations:
    product_native_text_owner: "image"
    product_native_text_strategy: "product_lock"
    scene_text_not_product_locked:
      - "\u00a330"
      - "when ur paying \u00a330"
      - "for this..."
